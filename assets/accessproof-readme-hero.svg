<rect x="-33" y="85" width="66" height="62" rx="11" fill="url(#accent)"/>
<circle cx="0" cy="112" r="6" fill="#04372f"/><path d="M0 116V128" stroke="#04372f" stroke-width="6" stroke-linecap="round"/>
</g>
